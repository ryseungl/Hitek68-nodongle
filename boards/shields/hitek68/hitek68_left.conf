# hitek68_left: BLE split central (no-dongle variant).
# Talks to the host over BLE/USB and to the right half over BLE.
# Applied automatically to the hitek68_left shield build.

CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=y
CONFIG_ZMK_BLE=y
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# One split peripheral (the right half) connects to this central.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=1

# 1 peripheral + 2 host BLE profiles: the left half pairs directly
# to the computer, no dongle needed.
CONFIG_BT_MAX_CONN=3
CONFIG_BT_MAX_PAIRED=3

# Required for the EC11 rotary encoder.
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# ZMK Studio: live keymap editing over USB (via the studio-rpc-usb-uart
# snippet in build.yaml). Locking disabled: anyone with USB access can
# remap; re-enable CONFIG_ZMK_STUDIO_LOCKING for an unlock sequence.
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n

# Deep sleep after 30 minutes idle (1800000 ms). Any keypress wakes the half.
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000
